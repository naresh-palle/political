name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages leaders-lens
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://political-ddmj.onrender.com/api

      - name: Deploy to Cloudflare Pages
        working-directory: frontend
        run: |
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-1b9ccc1557ec43d14cd6980a2aae9089}"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && { [ -z "$CLOUDFLARE_API_KEY" ] || [ -z "$CLOUDFLARE_EMAIL" ]; }; then
            echo "Set repository secret CLOUDFLARE_API_TOKEN (preferred), or CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL."
            echo "GitHub Pages is retired. This job must publish to the leaders-lens Pages project."
            exit 1
          fi
          npx wrangler pages deploy dist --project-name leaders-lens --commit-dirty=true
